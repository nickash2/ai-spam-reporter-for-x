name: Package extension release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example, v1.4.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag matches extension version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "Tag must start with v."
              exit 1
              ;;
          esac
          version="$(jq -r .version extension/manifest.json)"
          tag_version="${TAG_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag $TAG_NAME does not match extension version $version."
            exit 1
          fi

      - name: Package extension
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: zip -r "ai-spam-reporter-extension-${TAG_NAME}.zip" extension

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          archive="ai-spam-reporter-extension-${TAG_NAME}.zip"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$archive" --clobber
          else
            gh release create "$TAG_NAME" "$archive" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

  auto-patch-release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump patch version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --tags
          git checkout -B main origin/main

          changed_extension_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- extension/)"
          if [ -z "$changed_extension_files" ]; then
            echo "No extension package files changed; skipping the automatic release."
            exit 0
          fi
          echo "Extension package files changed; continuing with the release."

          version="$(jq -er '.version | select(type == "string")' extension/manifest.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version must have three numeric components."
            exit 1
          fi

          latest_tag="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          next_version=""
          if [ -n "$latest_tag" ]; then
            latest_version="${latest_tag#v}"
            newest_version="$(printf '%s\n%s\n' "$version" "$latest_version" | sort -V | tail -n 1)"
            if [ "$newest_version" = "$version" ] && [ "$version" != "$latest_version" ]; then
              next_version="$version"
            else
              version="$latest_version"
            fi
          fi

          if [ -z "$next_version" ]; then
            IFS=. read -r major minor patch <<< "$version"
            next_version="$major.$minor.$((patch + 1))"
          fi
          tag="v$next_version"
          archive="ai-spam-reporter-extension-$tag.zip"

          jq --arg version "$next_version" '.version = $version' extension/manifest.json > extension/manifest.json.tmp
          mv extension/manifest.json.tmp extension/manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json
          git commit -m "chore: release $tag [skip ci]"
          git tag "$tag"
          git push origin HEAD:refs/heads/main "refs/tags/$tag"

          zip -r "$archive" extension
          gh release create "$tag" "$archive" \
            --title "$tag" \
            --generate-notes
