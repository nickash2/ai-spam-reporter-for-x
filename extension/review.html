<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Spam Reporter for X</title>
  <link rel="stylesheet" href="review.css">
  <script type="module" src="review.mjs"></script>
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon48.png" width="36" height="36" alt="">
      <h1>AI Spam Reporter for X</h1>
    </header>

    <section class="card empty" id="guidance">
      <h2>Report a post on X</h2>
      <p>Open a post, or select <strong>Report AI Post</strong> directly on X.</p>
    </section>

    <section class="card" id="post" hidden aria-label="Selected post">
      <div class="post-header">
        <h2 id="handle"></h2>
        <a id="permalink" target="_blank" rel="noreferrer">View post <span aria-hidden="true">↗</span></a>
      </div>
      <p id="membership" class="badge" role="status"></p>
      <div class="actions">
        <button id="report" type="button" class="primary">Open report form <span aria-hidden="true">↗</span></button>
        <button id="copy" type="button" class="secondary">Copy link</button>
      </div>
      <p id="report-tip" class="note">Review and send on the report page.</p>
    </section>

    <section class="preferences" aria-label="X controls">
      <label class="setting">
        <span>Show controls on X</span>
        <input id="inline" type="checkbox" role="switch" checked>
      </label>
      <label class="setting">
        <span>Hide blocked accounts on X</span>
        <input id="hide" type="checkbox" role="switch">
      </label>
      <label class="setting">
        <span>Show "Previously blocked" tag</span>
        <input id="removed-tag" type="checkbox" role="switch" checked>
      </label>
      <p id="inline-status" class="note" role="status" hidden></p>
    </section>

    <footer class="list">
      <div class="list-info">
        <a href="https://blockedforaireply.com/" target="_blank" rel="noreferrer">blockedforaireply.com <span aria-hidden="true">↗</span></a>
        <p id="freshness" class="note">Checking the list…</p>
      </div>
      <button id="refresh" type="button" class="secondary">Sync list</button>
    </footer>
    <div class="sync-warning" id="sync-warning" hidden>
      <p id="sync-detail" role="status"></p>
      <button id="accept-list" class="secondary" type="button" hidden>Use smaller list</button>
    </div>
    <p id="feedback" role="status"></p>
    <footer class="app-footer">
      <p class="credit">Made by <a href="https://x.com/nickashdev" target="_blank" rel="noreferrer">@nickashdev</a></p>
      <div class="version-info" aria-label="Extension version and updates">
        <span id="version-label" class="note"></span>
        <a id="update-link" target="_blank" rel="noreferrer" hidden></a>
        <button id="update-refresh" type="button" class="secondary" aria-label="Check for updates" title="Check for updates">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 4.5V1.75M13.5 4.5h-2.75M2.5 11.5v2.75M2.5 11.5h2.75"></path>
            <path d="M13.1 4.1A5.75 5.75 0 0 0 3.3 2.8M2.9 11.9a5.75 5.75 0 0 0 9.8 1.3"></path>
          </svg>
        </button>
      </div>
    </footer>
  </main>
</body>
</html>
